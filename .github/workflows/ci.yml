name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Scan tracked and untracked files for common secret patterns
        run: bun run security:scan
      - name: Run unit tests
        run: bun run test
      - name: Type-check and build
        run: bun run build
      - name: Run backend domain tests
        run: bun run test:backend
