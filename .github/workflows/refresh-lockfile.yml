name: Regenerate Bun lockfile and verify

on:
  push:
    branches:
      - fix/bun-lockfile-and-ci

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/bun-lockfile-and-ci
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile from package.json
        run: bun install
      - name: Commit regenerated lockfile if changed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: regenerate Bun lockfile"
            git push origin HEAD:fix/bun-lockfile-and-ci
          fi
      - name: Verify lockfile is reproducible
        run: bun install --frozen-lockfile
      - name: Scan for common secret patterns
        run: bun run security:scan
      - name: Run unit tests
        run: bun run test
      - name: Type-check
        run: bun run lint
      - name: Build production app
        run: bun run build
      - name: Run backend domain tests
        run: bun run test:backend
